name: RedX iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build Go bridge
        working-directory: bridge
        run: |
          set -euo pipefail
          go mod tidy
          go get golang.org/x/mobile/bind@latest
          MOBILE_VERSION=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          go install golang.org/x/mobile/cmd/gomobile@$MOBILE_VERSION
          go install golang.org/x/mobile/cmd/gobind@$MOBILE_VERSION
          export PATH="$(go env GOPATH)/bin:$PATH"
          go test ./...
          gomobile init
          mkdir -p ../Frameworks ../RedX/Resources
          UPSTREAM=$(go list -m -f '{{.Dir}}' github.com/tamnd/xiaohongshu-cli)
          cp "$UPSTREAM/LICENSE" ../RedX/Resources/Upstream-LICENSE.txt
          gomobile bind -target=ios/arm64 -iosversion=17.0 -o ../Frameworks/RedBridge.xcframework .
          find ../Frameworks -name '*.h' -o -name module.modulemap
      - name: Build iOS app
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
          xcodebuild -project RedX.xcodeproj -scheme RedX -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RedX.app Payload/
          /usr/bin/zip -qry RedX.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: RedX-unsigned-IPA
          path: RedX.ipa
          if-no-files-found: error
