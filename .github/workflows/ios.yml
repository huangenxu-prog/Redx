name: ADBX iOS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate icon and project
        run: |
          set -euo pipefail
          swift scripts/icon.swift
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate
      - name: Build iOS app
        run: |
          set -euo pipefail
          xcodebuild -project ADBX.xcodeproj -scheme ADBX -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ADBX.app Payload/
          /usr/bin/zip -qry ADBX.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ADBX-unsigned-IPA
          path: ADBX.ipa
          if-no-files-found: error
