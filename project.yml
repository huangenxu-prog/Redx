name: ADBX
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  ADBX:
    type: application
    platform: iOS
    sources: [ADBX]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaoxiao.adbx
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ADBX
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your Android TV using ADB.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
